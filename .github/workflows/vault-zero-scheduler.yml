name: Vault Zero scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "17 6 * * *"
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  google-sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      API_URL: ${{ secrets.VAULTZERO_API_URL }}
      CRON_SECRET: ${{ secrets.VAULTZERO_CRON_SECRET }}
    steps:
      - name: Sync Google mail and calendar
        run: |
          set -euo pipefail
          : "${API_URL:?VAULTZERO_API_URL secret is empty or unset}"
          : "${CRON_SECRET:?VAULTZERO_CRON_SECRET secret is empty or unset}"
          case "$API_URL" in
            http://*|https://*) ;;
            *) echo "VAULTZERO_API_URL must include an http:// or https:// scheme" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 120 \
          -X POST "$API_URL/internal/sync/google" \
          -H "Authorization: Bearer $CRON_SECRET"

  agent-dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2-59/5 * * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      AGENT_URL: ${{ secrets.VAULTZERO_AGENT_URL }}
      AGENT_BRIDGE_SECRET: ${{ secrets.VAULTZERO_AGENT_BRIDGE_SECRET }}
    steps:
      - name: Drain queued agent work
        run: |
          set -euo pipefail
          : "${AGENT_URL:?VAULTZERO_AGENT_URL secret is empty or unset}"
          : "${AGENT_BRIDGE_SECRET:?VAULTZERO_AGENT_BRIDGE_SECRET secret is empty or unset}"
          case "$AGENT_URL" in
            http://*|https://*) ;;
            *) echo "VAULTZERO_AGENT_URL must include an http:// or https:// scheme" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 120 \
          -X POST "$AGENT_URL/internal/crm/dispatch" \
          -H "Authorization: Bearer $AGENT_BRIDGE_SECRET"

  rates:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      API_URL: ${{ secrets.VAULTZERO_API_URL }}
      CRON_SECRET: ${{ secrets.VAULTZERO_CRON_SECRET }}
    steps:
      - name: Refresh exchange rates
        run: |
          set -euo pipefail
          : "${API_URL:?VAULTZERO_API_URL secret is empty or unset}"
          : "${CRON_SECRET:?VAULTZERO_CRON_SECRET secret is empty or unset}"
          case "$API_URL" in
            http://*|https://*) ;;
            *) echo "VAULTZERO_API_URL must include an http:// or https:// scheme" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 120 \
          -X POST "$API_URL/internal/sync/rates" \
          -H "Authorization: Bearer $CRON_SECRET"

  telemetry:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 7 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      API_URL: ${{ secrets.VAULTZERO_API_URL }}
      CRON_SECRET: ${{ secrets.VAULTZERO_CRON_SECRET }}
    steps:
      - name: Roll up telemetry
        run: |
          set -euo pipefail
          : "${API_URL:?VAULTZERO_API_URL secret is empty or unset}"
          : "${CRON_SECRET:?VAULTZERO_CRON_SECRET secret is empty or unset}"
          case "$API_URL" in
            http://*|https://*) ;;
            *) echo "VAULTZERO_API_URL must include an http:// or https:// scheme" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 120 \
          -X POST "$API_URL/internal/telemetry/rollup" \
          -H "Authorization: Bearer $CRON_SECRET"
